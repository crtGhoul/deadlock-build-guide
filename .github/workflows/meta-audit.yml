name: Deadlock Meta Data Audit

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Meta Audit
        run: |
          python scripts/audit-items.py index.html audit-report.md
          cat audit-report.md >> $GITHUB_STEP_SUMMARY
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload Audit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deadlock-meta-audit-report
          path: audit-report.md
          retention-days: 14
